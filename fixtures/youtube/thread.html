<!doctype html>
<html>
  <head>
    <title>Invented video</title>
  </head>
  <body>
    <h1>Cache measurements</h1>
    <ytd-comments
      ><ytd-comment-thread-renderer
        ><ytd-comment-view-model data-comment-id="top"
          ><div id="content-text">
            I tested this on a laptop yesterday and the fan stayed quiet.
          </div></ytd-comment-view-model
        ><ytd-comment-replies-renderer id="replies"
          ><ytd-comment-view-model data-comment-id="reply"
            ><div id="content-text">
              Absolutely, great insight, thank you for sharing such a valuable
              perspective on this important topic.
            </div></ytd-comment-view-model
          ></ytd-comment-replies-renderer
        ></ytd-comment-thread-renderer
      >
      <form>
        <ytd-comment-view-model
          ><div id="content-text">
            This private draft must never be analysed by the extension.
          </div></ytd-comment-view-model
        >
      </form></ytd-comments
    >
  </body>
</html>
